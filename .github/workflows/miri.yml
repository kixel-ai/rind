name: miri

# Weekly only, at its own hour (see TESTING.md, "Scheduled workflows"). A
# Miri run takes hours, longer than a pull request should wait, and a
# cancelled check blocks the merge queue. Run `just miri TARGET` locally, or
# dispatch this workflow, to check a change before it lands.
on:
  schedule:
    - cron: "23 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The portable backend's tests under Miri: forced on x86_64, and on s390x,
  # which runs it big-endian. See `sh/miri.sh`.
  #
  # One job ran past GitHub's 6-hour limit: unsharded, the x86_64 tests
  # summed to over 9 CPU-hours on a fast desktop core, some taking an hour
  # alone. nextest's `slice` deals the tests to the shards in turn, so each
  # shard takes about a quarter of the total, bounded below by its slowest
  # test.
  miri:
    name: miri (${{ matrix.target }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
        shard: [1, 2, 3, 4]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      - name: Miri tests
        run: nix develop .#miri --command sh/miri.sh ${{ matrix.target }} --partition slice:${{ matrix.shard }}/4
