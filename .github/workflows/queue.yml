name: Queue

# GitHub's merge queue tests each picked PR on top of main, one at a time, on
# the self-hosted runners, and merges exactly the tree it tested. When the
# queue drops a PR, kixel-ai/quest's queue watcher on the x86_64 host runs
# the land fixer and re-enqueues it at the back of the queue.
#
# `main`'s ruleset requires the build's context, `Queue build / Build`, and
# its aarch64 job's, `Queue build / Build aarch64 Linux`.
# GitHub admits a PR to the queue only once its required checks pass on the PR
# itself, so the report job posts both, as skipped, on every main pull
# request's head; a skipped check satisfies the requirement.
# Only the merge group build runs code, and only a maintainer's pick enters
# the queue.
on:
  # Not `pull_request`: GitHub holds a fork's `pull_request` runs for approval
  # on every push, and each title or body edit started a run whose skipped
  # jobs report the contexts pending for a few seconds, refusing a PR enqueued
  # right after the edit. A `pull_request_target` run takes main's copy of this
  # file, runs without approval, and posts the contexts already completed.
  pull_request_target:
    branches: [main]
    # `edited` covers a PR retargeted to main, which needs the contexts too.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  # The manual fallback: `gh workflow run queue.yml -f sha=<head>` on main
  # reports the contexts on a head no pull_request_target run reached.
  workflow_dispatch:
    inputs:
      sha:
        description: The PR head commit to report the skipped required contexts on.
        required: true

permissions:
  contents: read

# No concurrency group: each merge group has its own ref, so its run never had
# another to replace, and a repeated report only posts the same skipped
# contexts twice.

jobs:
  # The build runs in queue-build.yml so its runner group can admit that
  # workflow alone; see that file. It calls main's copy, not the merge group's,
  # since the group admits that workflow only at refs/heads/main: a PR's edit to
  # queue-build.yml runs only after it lands.
  #
  # Its jobs report `Queue build / Build` and `Queue build / Build aarch64
  # Linux`, which main's ruleset requires, with no job after them waiting on a
  # hosted runner.
  build:
    name: Queue build
    if: github.event_name == 'merge_group'
    uses: kixel-ai/rind/.github/workflows/queue-build.yml@main

  # The merge queue still builds every group with the job above; this only
  # satisfies the PR-side requirement. It holds write access to checks even on
  # a fork's PR, so it takes nothing from the PR but its head SHA, through the
  # environment: no checkout, no action, no PR text in the script.
  report:
    name: Report Queue
    # Skips a title or body edit, whose head already carries the contexts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report the skipped required contexts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA" >&2; exit 1; }
          for name in 'Queue build / Build' 'Queue build / Build aarch64 Linux'; do
            gh api "repos/$REPO/check-runs" -f "name=$name" -f head_sha="$SHA" -f status=completed -f conclusion=skipped \
              -f "output[title]=$name" -f 'output[summary]=Skipped on the pull request; the merge queue builds the group.' --silent
          done
