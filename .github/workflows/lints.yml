name: quality lints

# Every job but the unstable rustfmt one runs the flake's pinned tools, so a
# new stable release can't fail it. `just ci` already runs x86_64 clippy and
# rustfmt on every merge.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: lints-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Check MSRV
        run: nix develop .#msrv --command cargo build --workspace --lib --bins

      # The x86_64 build above compiles only that backend, so check the others.
      - name: Check MSRV (aarch64, armv7)
        run: |
          nix develop .#msrv --command cargo check -p rind --lib --locked --target aarch64-unknown-linux-gnu
          nix develop .#msrv --command cargo check -p rind --lib --locked --target armv7-unknown-linux-gnueabihf

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: check module structure
        run: nix develop --command ./admin/structure

  clippy-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- --deny warnings

  # Checks the unstable style options, which only a nightly rustfmt reads.
  rustfmt-unstable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2025-02-14
          components: rustfmt

      - name: rustfmt (nightly)
        run: cargo +nightly-2025-02-14 fmt --check -- --config-path=.rustfmt.unstable.toml
