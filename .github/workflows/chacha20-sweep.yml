# Temporary: times aarch64 cipher::ChaCha20's paths at every length.
name: chacha20-sweep
on:
  push:
    branches: [quest/m2/verified-garbage/chacha20]
    paths: [.github/workflows/chacha20-sweep.yml, rind/src/low/aarch64/chacha20.rs, rind-bench/examples/chacha20_sweep.rs]
permissions:
  contents: read
jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: CPU
        run: lscpu 2>/dev/null || sysctl -n machdep.cpu.brand_string hw.ncpu
      - name: Sweep
        run: |
          cargo run --release -p rind-bench --example chacha20_sweep -- "$PATHS" >sweep.csv
          cat sweep.csv
        env:
          RUSTFLAGS: --cfg rind_sweep
          PATHS: ${{ matrix.runner == 'macos-15' && '1,0' || '1,0,4' }}
          ROUNDS: 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-${{ matrix.runner }}
          path: sweep.csv
