name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Record the CPU
        shell: bash
        run: |
          if [ "$(uname)" = Linux ]; then model=$(lscpu | sed -n 's/^Model name: *//p' | head -n1); else model=$(sysctl -n machdep.cpu.brand_string); fi
          echo "CPU: $model" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Probe
        run: .github/probe/run.sh
