name: bench
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf
      - name: Native armhf toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf libssl-dev:armhf
          lscpu
          setarch linux32 uname -m
          ls /proc/sys/fs/binfmt_misc
          if grep -l qemu /proc/sys/fs/binfmt_misc/*; then exit 1; fi
      - name: Build Graviola and HACL variants
        env:
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_INCLUDE_DIR: /usr/include
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_LIB_DIR: /usr/lib/arm-linux-gnueabihf
          RUSTFLAGS: --cfg rind_cpu_disable
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
        run: |
          mkdir -p .tmp
          cargo bench -p rind-bench --bench sha2 --target armv7-unknown-linux-gnueabihf --no-run --message-format=json > .tmp/build.json
          python3 - <<'PYBUILD'
          import json, shutil
          from pathlib import Path
          for line in Path('.tmp/build.json').read_text().splitlines():
              item = json.loads(line)
              if item.get('executable') and item['target']['name'] == 'sha2':
                  shutil.copy2(item['executable'], '.tmp/graviola')
          p = Path('rind/Cargo.toml')
          p.write_text(p.read_text().replace('target_arch = "aarch64", target_arch = "arm"', 'target_arch = "aarch64"'))
          p = Path('rind/src/low/arm/sha_armv4.rs')
          p.write_text(p.read_text().replace('None => generic::sha256::sha256_compress_blocks(state, blocks),', '''None => {
                      for piece in blocks.chunks((u32::MAX as usize / 64) * 64) {
                          libcrux_sha2::hacl::sha256_update_nblocks(piece.len() as u32, piece, state);
                      }
                  },'''))
          PYBUILD
          cargo bench -p rind-bench --bench sha2 --target armv7-unknown-linux-gnueabihf --no-run --message-format=json > .tmp/build.json
          python3 - <<'PYBUILD'
          import json, shutil
          from pathlib import Path
          for line in Path('.tmp/build.json').read_text().splitlines():
              item = json.loads(line)
              if item.get('executable') and item['target']['name'] == 'sha2':
                  shutil.copy2(item['executable'], '.tmp/hacl')
          PYBUILD
          file .tmp/graviola .tmp/hacl
          git diff > .tmp/hacl.patch
      - name: Interleaved native timings
        env:
          RIND_CPU_DISABLE_sha2: 1
          OPENSSL_armcap: "~0x10"
        run: |
          set -euo pipefail
          for variant in graviola hacl hacl graviola; do
            echo "VARIANT=$variant"
            setarch linux32 .tmp/$variant --bench --noplot '^sha256/(rind|aws-lc-rs)/(64B|1350B)$'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: armv7-sha256-comparison
          path: |
            .tmp/hacl.patch
            target/criterion
