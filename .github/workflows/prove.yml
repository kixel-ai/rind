name: prove

# Checks that the assembly rind imports is the object code its upstream's
# proofs check, and rind's HOL Light proofs in `proofs/hol-light/`,
# cosimulates rind's additions to s2n-bignum's x86 model against the runner's
# CPU, cosimulates pyca/verified-garbage's models against the code rind takes
# from it, checks that the NEON vectors the Lean proofs test their aarch64
# intrinsic models with are what an aarch64 CPU computes, translates rind's
# Rust under proof to Lean and checks the proofs in `proofs/`, and tests the
# Lean specs those proofs trust against the published vectors and rind. It
# runs nightly; pull requests don't run it, since nothing here gates a merge,
# and the merge queue's build runs `vg` (`CHECK_QUEUE` in sh/dispatch.sh).
#
# Each HOL Light target's proofs and the cosimulation are cached under the
# key `result_key` in `admin/prove` computes from their inputs. The nightly
# and dispatched runs never read the cache: they check everything, so a stale
# or planted entry never hides a failure there, and save each key whose check
# passes. A push to main that changes rind's source or build, the proofs, the
# checks, the vectors, rind's fork of s2n-bignum, or the flake that pins
# their tools runs only those jobs, looking each key up and checking and
# saving the ones main lacks, so a failure shows on the commit that caused it.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rind/src/**
      - rind/Cargo.toml
      - rind/build.rs
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - proofs/**
      - admin/prove
      - admin/prove-bytes
      - admin/simd-vectors.rs
      - admin/neon-vectors.rs
      - admin/avx512-vectors.rs
      - admin/upstream
      - admin/import-vg
      - admin/import-vg-models
      - admin/vg-bytes
      - admin/vg-cosim-runner.rs
      - admin/spec-tests/**
      - thirdparty/vectors/**
      - ALGORITHMS.md
      - flake.nix
      - flake.lock
      - thirdparty/s2n-bignum/**
      - .github/workflows/prove.yml
      - .github/actions/nix/**
      - .github/actions/prove/**

permissions:
  contents: read

# No concurrency group: main's runs never cancel each other, since a
# cancelled one saves nothing.

jobs:
  # Checks the bytes, which nothing caches, except on a push to main, and
  # on a push to main computes the key of each cached check, looking each up
  # without downloading anything. The jobs below skip a check whose key main
  # saved.
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      hol-light-aarch64: ${{ steps.keys.outputs.hol-light-aarch64 }}
      hol-light-x86_64: ${{ steps.keys.outputs.hol-light-x86_64 }}
      hol-light-armv7: ${{ steps.keys.outputs.hol-light-armv7 }}
      cosim: ${{ steps.keys.outputs.cosim }}
      hit-hol-light-aarch64: ${{ steps.hol-light-aarch64.outputs.cache-hit }}
      hit-hol-light-x86_64: ${{ steps.hol-light-x86_64.outputs.cache-hit }}
      hit-hol-light-armv7: ${{ steps.hol-light-armv7.outputs.cache-hit }}
      hit-cosim: ${{ steps.cosim.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Bytes
        if: github.event_name != 'push'
        run: nix develop .#hol-light --command admin/prove bytes

      - name: Keys
        id: keys
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          nix develop .#hol-light --command bash -euo pipefail -c '
            admin/prove key hol-light aarch64
            admin/prove key hol-light x86_64
            admin/prove key hol-light armv7
            admin/prove key cosim'
          for check in hol-light-aarch64 hol-light-x86_64 hol-light-armv7 cosim; do
            key=$(<".tmp/prove/keys/$check")
            echo "$check=$key" >>"$GITHUB_OUTPUT"
          done

      - name: Look up hol-light aarch64
        id: hol-light-aarch64
        if: ${{ !cancelled() && steps.keys.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/prove/keys
          key: ${{ steps.keys.outputs.hol-light-aarch64 }}
          lookup-only: true

      - name: Look up hol-light x86_64
        id: hol-light-x86_64
        if: ${{ !cancelled() && steps.keys.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/prove/keys
          key: ${{ steps.keys.outputs.hol-light-x86_64 }}
          lookup-only: true

      - name: Look up hol-light armv7
        id: hol-light-armv7
        if: ${{ !cancelled() && steps.keys.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/prove/keys
          key: ${{ steps.keys.outputs.hol-light-armv7 }}
          lookup-only: true

      - name: Look up cosim
        id: cosim
        if: ${{ !cancelled() && steps.keys.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/prove/keys
          key: ${{ steps.keys.outputs.cosim }}
          lookup-only: true

  # Each target's HOL Light proofs run in their own job, so the wall time is
  # the slower target's rather than the sum. Each limit only catches a hang:
  # it sits well above the target's measured time, with room for the proofs
  # queued next, and `admin/prove` prints each proof's time to show where it
  # goes. Each cached job runs unless `keys` found its key, even when `keys`
  # failed, so the nightly checks the proofs whether or not the bytes match.
  # On a push to main, a job waits for any other run checking the same key,
  # then looks it up again, so main checks each key once.
  #
  # aarch64's proofs took 2799 s on an Intel Core Ultra 7 270K, 2602 s of
  # them in `bn_mul_mont`, whose 4x path's two column-step lemmas take 930 s
  # each. GitHub's runners took 1.2 to 2.1 times as long as that machine on
  # the other aarch64 proofs, so the job can run about 100 minutes with the
  # build.
  hol-light-aarch64:
    needs: keys
    if: ${{ !cancelled() && needs.keys.outputs.hit-hol-light-aarch64 != 'true' }}
    concurrency:
      group: prove-${{ github.event_name == 'push' && needs.keys.outputs.hol-light-aarch64 || github.run_id }}-hol-light-aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: ./.github/actions/prove
        with:
          check: hol-light aarch64
          key: ${{ needs.keys.outputs.hol-light-aarch64 }}

  hol-light-x86_64:
    needs: keys
    if: ${{ !cancelled() && needs.keys.outputs.hit-hol-light-x86_64 != 'true' }}
    concurrency:
      group: prove-${{ github.event_name == 'push' && needs.keys.outputs.hol-light-x86_64 || github.run_id }}-hol-light-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: ./.github/actions/prove
        with:
          check: hol-light x86_64
          key: ${{ needs.keys.outputs.hol-light-x86_64 }}

  hol-light-armv7:
    needs: keys
    if: ${{ !cancelled() && needs.keys.outputs.hit-hol-light-armv7 != 'true' }}
    concurrency:
      group: prove-${{ github.event_name == 'push' && needs.keys.outputs.hol-light-armv7 || github.run_id }}-hol-light-armv7
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: ./.github/actions/prove
        with:
          check: hol-light armv7
          key: ${{ needs.keys.outputs.hol-light-armv7 }}

  cosim:
    needs: keys
    if: ${{ !cancelled() && needs.keys.outputs.hit-cosim != 'true' }}
    concurrency:
      group: prove-${{ github.event_name == 'push' && needs.keys.outputs.cosim || github.run_id }}-cosim
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: ./.github/actions/prove
        with:
          check: cosim
          key: ${{ needs.keys.outputs.cosim }}

  # pyca/verified-garbage's code for each target against VG's Lean models,
  # on the runner's CPU and, for what it lacks, Intel SDE or qemu-aarch64.
  # Each run takes its run ID as the seed, so each tries new cases; the merge
  # queue's build runs x86_64's with a fixed seed.
  vg:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./.github/actions/nix

      - name: Cosimulate
        run: nix develop .#vg --command admin/prove vg
        env:
          VG_COSIM_SEED: ${{ github.run_id }}

  neon:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Vectors
        run: |
          rustc --edition 2024 -O -o "$RUNNER_TEMP/neon-vectors" admin/neon-vectors.rs
          "$RUNNER_TEMP/neon-vectors" | diff - proofs/Rind/Aarch64/NeonVectors.lean

  lean:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#prove --command admin/prove lean

  # The spec tests, on every vector the driver's filters admit and on random
  # inputs from the run's own seed. Linking `spec-server` compiles every
  # Mathlib module it imports to C, about 15 minutes that Mathlib's cache does
  # not save, so this job keeps that out of the lean job's time.
  spec-tests:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Test the specs
        run: nix develop .#prove --command admin/prove spec-tests
        env:
          SPEC_TESTS_FULL: 1
          SPEC_TESTS_SEED: ${{ github.run_id }}
          SPEC_TESTS_RANDOM: 64
