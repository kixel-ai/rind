name: prove

# Translates rind's Rust under proof to Lean and checks the proofs in
# `proofs/`. Too slow for `just ci`, so it runs nightly and on pull requests
# that change rind's source, the proofs, or the flake that pins their tools.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - rind/src/**
      - proofs/**
      - admin/prove
      - flake.nix
      - flake.lock
      - .github/workflows/prove.yml

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#prove --command admin/prove
