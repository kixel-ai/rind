name: Alert

# Posts scheduled, landing, and release failures to the Discord #alerts channel,
# since those runs have no pull request to turn red. Reads the kixel-ai
# organization's DISCORD_WEBHOOK secret.

permissions:
  contents: read

on:
  workflow_run:
    # Matched by workflow `name:`, not filename. Only workflows that run outside
    # a pull request. `sh/alert.sh check` enforces the list.
    workflows:
      - asan
      - bench
      - build
      - dart-libraries
      - Dart release
      - Check
      - coverage
      - ctgrind
      - fuzz
      - miri
      - mutants
      - prove
      - Pullfrog
      - python
      - quality lints
      - Queue
      - regenerate
      - Release
      - timing
      - x86-cpu
    types:
      - completed

# No concurrency group: each run reports a different failed run, and
# scheduled runs can finish together, so cancelling would drop alerts.

jobs:
  discord:
    name: Discord
    # Scheduled runs alert only when scheduled, since whoever dispatched one
    # is already watching it, and alert when cancelled too: a job that runs
    # past its timeout ends `cancelled`, not `timed_out`, and any other
    # cancellation still leaves the scheduled check undone. Release and Check alert however they ran:
    # they follow the queue's pushes to main, which nobody watches. So does
    # Dart release, which a tag push starts with nobody watching. Their
    # cancellations are excluded, since a newer push supersedes a run as a
    # matter of course. Queue failures stay on the PR and go to the queue
    # watcher and fixer.
    if: >-
      (github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion)) ||
      (contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["Release", "Check", "Dart release"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: sh/alert.sh discord
