name: Alert

# Posts to Discord #alerts when a scheduled run, the landing check, or a
# release stops and nobody is watching. Reads the kixel-ai organization's
# DISCORD_WEBHOOK secret. A job that runs past its time limit ends cancelled,
# not timed_out. Release and Dart release set no timeout-minutes, so a hung
# publish dies at GitHub's 360-minute default.

permissions:
  contents: read
  # Classifying a cancellation reads the run's jobs and their check annotations.
  actions: read
  checks: read

on:
  workflow_run:
    # Matched by workflow `name:`, not filename. `sh/alert.sh check` requires
    # every workflow whose failure can go unseen. A workflow that runs only
    # from a pull request, as a caller, or from a manual dispatch is left out,
    # because someone is already watching that run. Pullfrog is dispatch-only.
    # Queue runs from a pull request, the merge queue, or a dispatch, and a
    # failure there stays on the PR for the queue watcher.
    workflows:
      - asan
      - bench
      - build
      - dart-libraries
      - Dart release
      - Check
      - coverage
      - ctgrind
      - fuzz
      - miri
      - mutants
      - prove
      - python
      - quality lints
      - regenerate
      - Release
      - timing
      - x86-cpu
    types:
      - completed

# No concurrency group: each run reports a different failed run, and
# scheduled runs can finish together, so cancelling would drop alerts.

jobs:
  discord:
    name: Discord
    # Scheduled runs start this job on failure, timed_out, or cancelled. The
    # script posts a cancellation only when a job annotation says it exceeded
    # its maximum execution time, including the hosted runner's "The job
    # running on runner ... has exceeded the maximum execution time of ..."
    # form. A hand cancel, or a dispatch that replaces the nightly (these
    # workflows share one concurrency group per ref, with cancel-in-progress),
    # does not post. Release and Dart release post on failure, timed_out, and
    # a cancelled run that started a job, however they ran. release.yml sets
    # cancel-in-progress to false, so a newer push leaves an in-progress
    # publish running and cancels only a pending one, which never starts a
    # job and does not post. Dart release has no concurrency group. A
    # cancellation the jobs API cannot classify still posts, and the embed
    # says so. Check posts on failure and timed_out only. It sets
    # cancel-in-progress, so a newer push cancels an in-progress run after
    # the job has started, and that is the ordinary cancellation. A job that
    # hits Check's timeout-minutes also ends cancelled; posting that one
    # would start this job for every superseded Check.
    if: >-
      (github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion)) ||
      (contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["Release", "Check", "Dart release"]'), github.event.workflow_run.name)) ||
      (contains(fromJSON('["cancelled"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["Release", "Dart release"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: sh/alert.sh discord
