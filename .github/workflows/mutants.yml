name: mutants

# Mutation testing with cargo-mutants, through `admin/mutants`, on each
# architecture rind has a runner for, on armv7 under qemu, and on the portable
# backend forced on x86_64. A mutant no run's tests catch fails the run, which
# alert.yml reports: kill it with a test, or list it under `exclude_re` in
# .cargo/mutants.toml with why no test can. The x86_64 run's survivors are
# tried again under Intel SDE, on the AVX-512 paths no runner takes.
#
# Nightly, it mutates the Rust that changed in the last day. Dispatched, it
# runs a whole campaign, which `admin/mutants` refuses off GitHub-hosted
# runners: every architecture's over the workspace, or one crate's, one
# architecture's, or the changes since `base`, as in
# `gh workflow run mutants.yml --ref <branch> -f package=rind-rustls`.
# Like fuzzing, it never runs on pull requests: a large diff's mutants take
# hours of every architecture's runners.
#
# `shards` lists each campaign's mutants and splits them into jobs of about
# `SHARD_SECONDS` each, by the seconds a mutant took on that campaign's runner.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Run only this architecture's campaign
        type: choice
        default: all
        options: [all, x86_64, aarch64, macos, armv7, portable]
      package:
        description: Mutate only this crate, such as rind-rustls, rather than the workspace
        required: false
        default: ""
      base:
        description: Mutate only the changes since this revision
        required: false
        default: ""

# One dispatched campaign runs at a time, so `max-parallel` caps them all; the
# rest wait without holding a runner. Nightlies queue apart.
concurrency:
  group: mutants-${{ github.event_name }}
  queue: max

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each shard's estimated mutant time, leaving the 300-minute job limit room
  # for setup, the baseline build and test (up to 35 minutes under SDE), and
  # mutants slower than the mean.
  SHARD_SECONDS: 10800

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mutants: ${{ steps.count.outputs.mutants }}
      armv7: ${{ steps.count.outputs.armv7 }}
      diff: ${{ steps.diff.outputs.diff }}
      avx512: ${{ steps.count.outputs.avx512 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff's base can lie anywhere in the history.
          fetch-depth: 0

      - uses: ./.github/actions/nix

      # Taken once, so a shard that waits hours for a runner mutates the same
      # diff as the rest.
      - name: Diff
        id: diff
        run: |
          if [ "$EVENT" = schedule ]; then
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
          fi
          if [ -n "$BASE" ]; then
            git diff "$(git merge-base "$BASE" HEAD)" HEAD -- '*.rs' > "$RUNNER_TEMP/changes.diff"
            echo diff=true >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.diff
        with:
          name: changes
          path: ${{ runner.temp }}/changes.diff
          retention-days: 14

      # Seconds a mutant takes on each runner: the higher of two diffs' means
      # in the shards' `outcomes.json`, measured in November 2026, since a
      # diff's mean varies by twice that, by which tests its code has.
      # macOS mutates only the DIT code, all of it whenever its files changed,
      # since a test change there can let any of its mutants survive: few
      # enough mutants for one job.
      - name: Count
        id: count
        run: |
          [[ "$PACKAGE" =~ ^[A-Za-z0-9_-]*$ ]] || { echo "::error::no crate is named '$PACKAGE'"; exit 1; }
          scope=()
          [ -z "$DIFF" ] || scope=(--in-diff "$RUNNER_TEMP/changes.diff")
          crate=(--workspace)
          [ -z "$PACKAGE" ] || crate=(-p "$PACKAGE")
          matrix='[]'
          add() {
            local name=$1 os=$2 shell=$3 seconds=$4
            shift 4
            [ "$CAMPAIGN" = all ] || [ "$CAMPAIGN" = "$name" ] || return 0
            # Only rind's own code differs on these; the adapters' tests run on
            # x86_64 and aarch64.
            if [ "$name" != x86_64 ] && [ "$name" != aarch64 ] && [ -n "$PACKAGE" ] && [ "$PACKAGE" != rind ]; then
              [ "$CAMPAIGN" = all ] || { echo "::error::the $name campaign mutates only rind"; exit 1; }
              return 0
            fi
            if [ "$name" = macos ]; then
              count=0
              if [ -z "$DIFF" ] || grep -qE '^\+\+\+ b/rind/src/low/((aarch64/)?cpu|entry)\.rs$' "$RUNNER_TEMP/changes.diff"; then
                count=$(nix develop --command admin/mutants "$@" --list | wc -l)
              fi
              shards=$((count > 0))
            else
              count=$(nix develop --command admin/mutants "$@" ${scope[@]+"${scope[@]}"} --list | wc -l)
              shards=$(((count * seconds + SHARD_SECONDS - 1) / SHARD_SECONDS))
            fi
            echo "$name: $count mutants in $shards jobs" | tee -a "$GITHUB_STEP_SUMMARY"
            matrix=$(jq -c --arg name "$name" --arg os "$os" --arg shell "$shell" --arg args "$*" --argjson shards "$shards" \
              '. + [range($shards) | {name: $name, os: $os, shell: $shell, args: $args, shard: ., shards: $shards}]' <<<"$matrix")
          }
          # `--target` lets this x86_64 runner list another's campaign.
          add x86_64 ubuntu-latest default 68 --target x86_64-unknown-linux-gnu "${crate[@]}"
          add aarch64 ubuntu-24.04-arm default 24 --target aarch64-unknown-linux-gnu "${crate[@]}"
          # macos-latest is Apple silicon, the only cores rind sets DIT on.
          add macos macos-latest default 0 --target aarch64-apple-darwin -p rind
          add armv7 ubuntu-latest armv7 280 --target armv7-unknown-linux-gnueabihf -p rind
          # What only the portable backend compiles, and what armv7's assembly
          # replaces. Its adapters' code is the same as on x86_64.
          add portable ubuntu-latest default 66 --portable -p rind
          # armv7's shards, the most, get a matrix of their own, since GitHub
          # runs at most 256 jobs a matrix.
          for job in mutants armv7; do
            rows=$(jq -c --arg job "$job" 'map(select((.name == "armv7") == ($job == "armv7")))' <<<"$matrix")
            jobs=$(jq length <<<"$rows")
            [ "$jobs" -le 256 ] || { echo "::error::$jobs $job jobs, more than a matrix's 256"; exit 1; }
            echo "$job=$rows" >> "$GITHUB_OUTPUT"
          done
          # The files only AVX-512 runs may hold mutants when x86_64's hold none.
          if [ "$CAMPAIGN" = all ] || [ "$CAMPAIGN" = x86_64 ]; then
            echo "avx512=${crate[*]}" >> "$GITHUB_OUTPUT"
          fi
        env:
          CAMPAIGN: ${{ inputs.campaign || 'all' }}
          PACKAGE: ${{ inputs.package }}
          DIFF: ${{ steps.diff.outputs.diff }}

  mutants:
    needs: shards
    if: needs.shards.outputs.mutants != '[]'
    strategy:
      fail-fast: false
      # So do armv7's and avx512's, which starts after this, so a campaign
      # holds at most 20 of the organisation's 60 hosted jobs.
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.mutants) }}
    name: mutants (${{ matrix.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps: &mutate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.shards.outputs.diff
        with:
          name: changes
          path: ${{ runner.temp }}

      # Exit 2, a missed mutant, may be code only another architecture
      # compiles, so `survivors` decides.
      - name: Mutate
        run: |
          read -ra args <<<"$ARGS"
          scope=()
          [ -z "$DIFF" ] || [ "$RUNNER_OS" = macOS ] || scope=(--in-diff "$RUNNER_TEMP/changes.diff")
          nix develop ".#$DEV_SHELL" --command admin/mutants "${args[@]}" ${scope[@]+"${scope[@]}"} \
            --shard "$SHARD/$SHARDS" --sharding round-robin --output "$RUNNER_TEMP" || [ $? -eq 2 ]
        env:
          DEV_SHELL: ${{ matrix.shell }}
          ARGS: ${{ matrix.args }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          DIFF: ${{ needs.shards.outputs.diff }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          retention-days: 14
          if-no-files-found: ignore

  armv7:
    needs: shards
    if: needs.shards.outputs.armv7 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.armv7) }}
    name: mutants (${{ matrix.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps: *mutate

  # Lists what the x86_64 shards caught, timed out, or found unviable, which
  # `avx512` skips, and splits the rest, what they missed and the files only
  # AVX-512 runs, into shards as `shards` does.
  avx512-shards:
    needs: [shards, mutants]
    if: ${{ !cancelled() && !failure() && needs.shards.outputs.avx512 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-x86_64-*
          path: ${{ runner.temp }}/x86_64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.shards.outputs.diff
        with:
          name: changes
          path: ${{ runner.temp }}

      # One artifact downloads into `x86_64` itself, several into a
      # subdirectory each, so `find` reads both. `--iterate` reads
      # `previously_caught.txt`.
      - name: Count
        id: count
        run: |
          mkdir -p "$RUNNER_TEMP/x86_64" "$RUNNER_TEMP/iterate/mutants.out"
          find "$RUNNER_TEMP/x86_64" \( -name caught.txt -o -name timeout.txt -o -name unviable.txt \) \
            -exec cat /dev/null {} + > "$RUNNER_TEMP/iterate/mutants.out/previously_caught.txt"
          read -ra crate <<<"$CRATE"
          scope=()
          [ -z "$DIFF" ] || scope=(--in-diff "$RUNNER_TEMP/changes.diff")
          count=$(nix develop --command admin/mutants --avx512 "${crate[@]}" ${scope[@]+"${scope[@]}"} \
            --iterate --list --output "$RUNNER_TEMP/iterate" | wc -l)
          shards=$(((count * 2100 + SHARD_SECONDS - 1) / SHARD_SECONDS))
          [ "$shards" -le 256 ] || { echo "::error::$shards jobs, more than a matrix's 256"; exit 1; }
          echo "avx512: $count mutants in $shards jobs" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "shards=$(jq -c -n --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
        env:
          CRATE: ${{ needs.shards.outputs.avx512 }}
          DIFF: ${{ needs.shards.outputs.diff }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avx512-iterate
          path: ${{ runner.temp }}/iterate/mutants.out/previously_caught.txt
          retention-days: 14

  # Retests what the x86_64 shards missed, and the files only AVX-512 runs,
  # under SDE's Sapphire Rapids model, where a mutant the tests miss, as most
  # here are, takes 14 to 35 minutes, by the runner's CPU.
  avx512:
    needs: [shards, avx512-shards]
    # A skipped `mutants` would skip this too without the status check.
    if: ${{ !cancelled() && !failure() && needs.avx512-shards.result == 'success' && needs.avx512-shards.outputs.shards != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.avx512-shards.outputs.shards) }}
    name: avx512 (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avx512-iterate
          path: ${{ runner.temp }}/mutants.out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.shards.outputs.diff
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Mutate
        run: |
          read -ra crate <<<"$CRATE"
          scope=()
          [ -z "$DIFF" ] || scope=(--in-diff "$RUNNER_TEMP/changes.diff")
          nix develop .#sde --command admin/mutants --avx512 "${crate[@]}" ${scope[@]+"${scope[@]}"} --iterate \
            --shard "$SHARD/$SHARDS" --sharding round-robin --output "$RUNNER_TEMP" || [ $? -eq 2 ]
        env:
          CRATE: ${{ needs.shards.outputs.avx512 }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          DIFF: ${{ needs.shards.outputs.diff }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-avx512-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          retention-days: 14
          if-no-files-found: ignore

  # Runs once every shard has passed, a stage with nothing to mutate skipped.
  survivors:
    needs: [mutants, armv7, avx512]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/mutants

      # One artifact downloads into `mutants` itself, several into a
      # subdirectory each.
      - name: Survivors
        run: |
          shopt -s nullglob
          admin/mutants --survivors "$RUNNER_TEMP"/mutants "$RUNNER_TEMP"/mutants/*/
