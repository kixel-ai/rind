# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    # Only main may deploy to this environment, so a dispatch on a pushed
    # branch can't mint the OIDC token Pullfrog trades for model access.
    environment: pullfrog
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Edited: give the agent the dev shell and the test vectors its `just
      # test` reads, since the agent cannot write `.git` to fetch them. This
      # checkout is the default branch (dispatch only), so nothing here runs
      # a PR head's code.
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/vectors
      - name: Build the dev shell
        run: nix develop --command true
      - name: Run agent
        uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0.1.127
        with:
          prompt: ${{ inputs.prompt }}
        # No provider keys from this repository: model access is configured
        # in the Pullfrog console (https://docs.pullfrog.com/model-access).
