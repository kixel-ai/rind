# Temporary: reproduces the dart-ios hang many times at once, with diagnostics.
name: dart-ios-debug
on:
  pull_request:
    paths: [.github/workflows/dart-ios-debug.yml]
permissions:
  contents: read
concurrency:
  group: dart-ios-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: rind-dart/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter create --platforms ios .
      - name: Run tests
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          d="$RUNNER_TEMP/diag"
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" > "$d/bootstatus.log" 2>&1
          echo "booted $udid"
          xcrun simctl spawn "$udid" log stream --style compact > "$d/simlog.txt" 2>&1 &
          ( while true; do date; ps -axo pid,ppid,etime,stat,%cpu,command | grep -E 'simctl|flutter|Runner|xcodebuild|launchd_sim|SpringBoard' | grep -v grep; sleep 20; done ) > "$d/ps.txt" 2>&1 &
          set +e
          timeout 900 flutter test integration_test -d "$udid" -v > "$d/flutter.log" 2>&1
          rc=$?
          echo "flutter test rc=$rc"
          if [ $rc -ne 0 ]; then
            for p in $(pgrep -f 'simctl'); do echo "== sample $p"; ps -o pid,ppid,etime,stat,command -p $p; sample $p 3 -file "$d/sample-$p.txt" >/dev/null 2>&1; done
            xcrun simctl list devices > "$d/devices.txt" 2>&1
          fi
          tail -n 60 "$d/flutter.log"
          exit $rc
      - name: Diagnostics
        if: always()
        run: |
          d="$RUNNER_TEMP/diag"
          echo "--- ps"; tail -n 60 "$d/ps.txt" || true
          echo "--- simlog tail"; tail -n 80 "$d/simlog.txt" || true
          echo "--- devices"; cat "$d/devices.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.n }}
          path: ${{ runner.temp }}/diag
