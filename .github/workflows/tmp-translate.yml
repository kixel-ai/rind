name: tmp-translate

# Temporary, removed before review: translates rind's Rust under proof to Lean
# and uploads the generated files, for proof work on a host without Aeneas.
on:
  push:
    branches: [quest/m4/verified/portable-sha2-lean]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Translate
        run: PROVE_TRANSLATE_ONLY=1 nix develop .#prove --command admin/prove lean
      - name: Pack
        if: ${{ !cancelled() }}
        run: git ls-files --others --ignored --exclude-standard proofs/Rind | tar czf translation.tgz -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: translation
          path: translation.tgz
