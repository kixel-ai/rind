name: vg

# Cosimulates pyca/verified-garbage's models against the code rind takes from
# it. `prove` calls it, and the merge queue when a group touches `prove`'s
# paths, so both run the same jobs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # pyca/verified-garbage's code for each target against VG's Lean models,
  # on the runner's CPU and, for what it lacks, Intel SDE or qemu-aarch64.
  # A pull request and a merge group run the fixed seed 1; the nightly and
  # dispatched runs take their run ID as the seed, so each tries new cases.
  #
  # Each OS took 5 to 10 minutes over the last eight pull requests and the
  # nightly of 2026-11-18. The limit only catches a hang, and stays well below
  # the queue build's 60 minutes, which waits for it.
  vg:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./.github/actions/nix

      - name: Cosimulate
        run: nix develop .#vg --command admin/prove vg
        env:
          VG_COSIM_SEED: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 1 || github.run_id }}
