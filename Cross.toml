# cross runs the Android tests in images holding the NDK and an Android 9
# system built from AOSP, and the ARMv6 Linux tests in images holding that
# target's GCC and glibc, under qemu-user where the host's architecture
# differs. Images are pinned, since cross publishes them only under moving tags.

[build.env]
passthrough = [
  "QEMU_CPU",
  "RIND_TEST_ARM_CRYPTO_EXT",
  "RIND_TEST_ARM_NEON",
]

[target.aarch64-linux-android]
image = "ghcr.io/cross-rs/aarch64-linux-android@sha256:b081e122d075268e8f528b914ae0b2d0c6dc4dc4921ab05da86cc44726f4e2a0"

[target.armv7-linux-androideabi]
image = "ghcr.io/cross-rs/armv7-linux-androideabi@sha256:a930d41f9acf6cae27c9c99b72e673cb11e973859a1c5a909769d0921bb4a83c"

[target.arm-linux-androideabi]
image = "ghcr.io/cross-rs/arm-linux-androideabi@sha256:806d4227824454e6ce961d6c90bc81076c6bb57d2e04384f98e41a5df2f5d17c"

[target.arm-unknown-linux-gnueabi]
image = "ghcr.io/cross-rs/arm-unknown-linux-gnueabi@sha256:aaa032e0653ab9970722893a04f7ec01de7ba5ded73724866f357863b04ebeec"

[target.arm-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-gnueabihf@sha256:439a691170d7751977e709c8aac6b4cef78fde9c8709286b04a088316e9a584f"

# The x86_64 host runs the binaries itself, on its own CPU's features, rather
# than under qemu's model without AES-NI.
[target.x86_64-linux-android]
image = "ghcr.io/cross-rs/x86_64-linux-android@sha256:5779721607756da8c49c032edc5f82970f7295d3a42c2ab4cba49e69ba40a18d"
runner = "native"
