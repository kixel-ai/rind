# The decision on every gap: each operation where another library beats rind
# by more than 10%, on a host in benchmarks/data or a CPU tier of the weekly
# bench. BENCHMARKS.md lists them under Known gaps. `admin/bench-report
# render` refuses a gap without an entry, and an entry that covers no gap, so
# a refresh that opens or closes one must update this file.
#
# Each entry:
#   operations  report rows on a host, as admin/bench-report's OPERATIONS
#               without the library; weekly benchmark IDs on a tier, as the
#               report's tier table shows them. Either may be a glob, where
#               `*` also matches the library's own `*`
#   on          hosts, or CPU tiers as the report's tier columns name them;
#               the entry must cover some gap where the report's data
#               measures any of them
#
# The weekly bench's `gate` job fails on a gap over 10% that two scheduled
# runs in a row show without an entry here.
#   quest       the quest that closes it, or
#   reason      why it stays

[[gap]]
operations = ["chacha20poly1305/*/16KB", "chacha20poly1305-open/*/16KB", "xchacha20poly1305/*/16KB"]
on = ["no AES-NI", "SSE2"]
reason = "Without SSE4.1 rind runs Graviola's scalar Poly1305 rather than port BoringSSL's SSE2 `poly1305_vec.c` for CPUs older than Westmere, as ALGORITHMS.md records."

[[gap]]
operations = ["quic-header-protection/aes128", "quic-header-protection/aes256"]
on = ["kixtop"]
reason = "AES header protection on aarch64 reaches the key's cipher through an indirect call, as ALGORITHMS.md notes, which costs 3.5 ns against aws-lc-rs's 2.8 ns for one block."

[[gap]]
operations = ["sha3-256/64B", "sha3-512/64B"]
on = ["kixtop"]
reason = "Not rind's hashing: `kixtop`'s data is its run on [`0d2e74b4`](https://github.com/kixel-ai/rind/commit/0d2e74b489c1067beeab373f9de75d24574b4bc5), from before rind's rows held DIT, and these rows had no DIT-held time, so they include rind's per-call DIT toggle (about 35 ns of 166 and 170 ns) that the other libraries never pay. `kixtop` was offline for this refresh; its next run times rind holding DIT and rechecks them."

[[gap]]
operations = ["p521-ecdh-stored/*"]
on = ["portable"]
reason = "P-521 ECDH with a stored key on the portable backend, fiat-crypto's arithmetic on 64-bit limbs, measured 1.12× aws-lc's C without assembly in [run 43646114817](https://github.com/kixel-ai/rind/actions/runs/43646114817), where [#614](https://github.com/kixel-ai/rind/pull/614)'s measurement on a shared x86_64 host had P-521 ECDH at 0.91 to 1.03×, and the ephemeral-key row is within 10% in the same run. Rare on targets without assembly; the next refresh rechecks it."

[[gap]]
operations = ["aes*-gcm*", "rustls-bulk/*", "aes*-ctr/*", "aes*-cbc-*"]
on = ["portable"]
reason = "The portable backend runs aws-lc's `aes_nohw.c` in its 64-bit configuration, four blocks a pass ([#621](https://github.com/kixel-ai/rind/pull/621)), while this row builds aws-lc's C for x86_64, where it bitslices eight blocks into SSE2 registers: the configuration aws-lc itself runs on the other 64-bit targets the backend is for is rind's. In [run 43646114817](https://github.com/kixel-ai/rind/actions/runs/43646114817) AES-GCM measured 1.10 to 1.21× from 1200 B, AES-CTR 1.26 to 1.45×, and CBC decryption 1.14 to 1.24×; shorter messages are within 10%."

[[gap]]
operations = ["sha1/*", "hmac-sha1/*"]
on = ["portable"]
reason = "rind's portable SHA-1 trails aws-lc's C by 1.1 to 1.25× from 1200 B up, as it still did in [run 43282064559](https://github.com/kixel-ai/rind/actions/runs/43282064559) on a later main. SHA-1 survives only for legacy signatures and HMAC-SHA-1, which are rare on targets without assembly, so it stays rather than take aws-lc's integer `sha1_block_data_order_nohw`, which armv7 without NEON already runs, as a speed quest."

[[gap]]
operations = ["sha256/*", "sha256-updates/*", "hmac-sha256/*", "sha512*", "hmac-sha384/*"]
on = ["portable"]
reason = "HACL*'s verified SHA-256 and SHA-512, through libcrux-sha2, trail aws-lc's C from 1200 B up in [run 43646114817](https://github.com/kixel-ai/rind/actions/runs/43646114817): SHA-256 and HMAC-SHA-256 1.11 to 1.17×, SHA-512, SHA-512/256, and HMAC-SHA-384 1.15 to 1.22× at 8 and 16 KB. Under the source rule the portable backend runs the fastest permissive SHA-2 and plans its proof; measuring aws-lc's and Graviola's against HACL* on a 64-bit target and switching is the report-refresh PR's suggested follow-up."

[[gap]]
operations = ["aes*", "quic-header-protection/aes*", "rustls-bulk/aes*", "hpke-*-aes128-gcm-*"]
on = ["armv7 NEON"]
reason = "Without the crypto extension rind runs aws-lc's constant-time `aes_nohw` and integer GHASH, ported to Rust, where aws-lc-rs runs its NEON assembly: bitsliced `bsaes-armv7` for CTR and CBC decryption, `vpaes-armv7` for single blocks, and `ghash-armv4`'s NEON GHASH. In [run 43646114817](https://github.com/kixel-ai/rind/actions/runs/43646114817), after [#621](https://github.com/kixel-ai/rind/pull/621), AES-CTR measured 1.1 to 1.2× aws-lc-rs's time, CBC decryption 1.2 to 1.5×, CBC encryption, AES-KW, and header protection 2.0 to 2.2×, and AES-GCM, HPKE's AES-128-GCM seal and open, and rustls's AES bulk 1.4 to 3.4×. Running aws-lc's NEON routines is the report-refresh PR's suggested follow-up."

[[gap]]
operations = ["aes*-kw-unwrap/*/16B", "aes*-kwp-unwrap/*/16B"]
on = ["x86_64", "no AVX2"]
reason = "Unwrapping a 16-byte key takes 35 to 55 ns more than aws-lc-rs's 280 to 400 ns on the EPYC runners of [run 43646114817](https://github.com/kixel-ai/rind/actions/runs/43646114817), 1.11 to 1.20× its time; wrapping, every longer key, and every other tier are within 10%, and aarch64 unwraps in 0.68× aws-lc-rs's time. Key wrap is rare and runs once per stored key, so the fixed cost stays without a quest; the next refresh rechecks it."

[[gap]]
operations = ["mlkem768-keygen"]
on = ["nixos", "ovh-iad", "ovh-sea"]
reason = "Decided in [kixel-ai/rind#812](https://github.com/kixel-ai/rind/pull/812): on x86_64 without AVX-512, ML-KEM-768 key generation stays on rind's arithmetic though pyca/verified-garbage's is faster, since a key pair decapsulates on the arithmetic that generated it and VG's decapsulation is 1.17 to 1.25× slower there, and decapsulation is the hot path."

[[gap]]
operations = ["oprf-ristretto255-blind", "oprf-ristretto255-evaluate"]
on = ["nixos", "ovh-iad", "ovh-sea"]
reason = "ristretto255's constant-time variable-base multiplication, a four-bit fixed window over s2n-bignum's field arithmetic, trails RustCrypto's `voprf` over curve25519-dalek's AVX2 vector backend: blinding 1.18 to 1.25× and evaluation 1.24 to 1.30× its time on these AVX2 hosts. Running dalek's AVX2 formulas there, as Ed25519 verification without ADX already does, is the report-refresh PR's suggested follow-up."

[[gap]]
operations = ["p384-ecdsa-sign"]
on = ["nixos", "ovh-sea"]
quest = "/quest/m2/verified-garbage/p384.md"

[[gap]]
operations = ["sha3-512/16KB"]
on = ["ovh-sea"]
quest = "/quest/m2/verified-garbage/sha3.md"

[[gap]]
operations = ["p256-ecdsa-verify"]
on = ["nixos"]
quest = "/quest/m2/verified-garbage/p256.md"

[[gap]]
operations = ["rsa2048-pkcs1-sha256-sign", "rustls-bulk/chacha20poly1305", "rustls-resumed-handshake/x25519", "sha3-256/16KB", "sha3-512/16KB"]
on = ["nixos"]
reason = "Noise: CI jobs on `nixos` kept about 4 CPUs busy through this run, and a second run of the same commit right after it, under more load elsewhere, measured each of these within 10% of the fastest: PKCS#1 signing 0.97× graviola's time (PSS signing 0.94× in this run), ChaCha20-Poly1305 bulk 1.03× ring's, the resumed handshake 1.00× graviola's, and SHA3-256 and SHA3-512 at 16 KB 0.96 and 1.04× aws-lc-rs's. The next refresh rechecks them."
