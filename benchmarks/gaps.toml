# The decision on every gap: each operation where another library beats rind
# by more than 10%, on a host in benchmarks/data or a CPU tier of the nightly
# bench. BENCHMARKS.md lists them under Known gaps. `admin/bench-report
# render` refuses a gap without an entry, and an entry that names no gap, so
# a refresh that opens or closes one must update this file.
#
# Each entry:
#   operations  report rows on a host, as admin/bench-report's OPERATIONS
#               without the library; nightly benchmark IDs on a tier, as the
#               report's tier table shows them
#   on          hosts, or CPU tiers as the report's tier columns name them;
#               every operation must be a gap on every one
#   quest       the speed quest that closes it, or
#   reason      why it stays

[[gap]]
operations = ["rsa2048-pkcs1-sha256-sign", "rsa2048-pss-sha256-sign", "rustls-full-handshake-key/rsa-2048"]
on = ["nixos", "desktop", "nixos2"]
quest = "/quest/m2/speed/x86-rsa2048-sign.md"

[[gap]]
operations = ["sha256/64B"]
on = ["nixos", "desktop"]
reason = "Narrowed by [#352](https://github.com/moq-dev/rind/pull/352), after this data: on the SHA extensions the last block is padded and the digest written in registers, and `digest::Context::finish` takes `&mut self`, so it no longer copies the context. Interleaved runs on `nixos` measured rind at 1.16× RustCrypto's time and 1.03× graviola's at 64 B, from 1.44×, and ahead of both at 32 B; `digest::digest` beats RustCrypto at 64 B. Closed by [#394](https://github.com/moq-dev/rind/pull/394), which drops the context's wipe on drop: on GitHub's AMD EPYC 9V45 runner it measured rind at 0.84× main's time at 64 B and 0.86× RustCrypto's. The next refresh drops this entry."

[[gap]]
operations = ["sha512/16KB"]
on = ["nixos", "desktop", "nixos2"]
reason = "Closed by [#353](https://github.com/moq-dev/rind/pull/353), after this data: CPUs with AVX2 run OpenSSL's AVX2 routine, the one OpenSSL runs on `nixos2`, and those with the SHA512 instructions OpenSSL's routine for them. Interleaved runs measured rind at 0.96× OpenSSL's time on `nixos` and 0.22× on `desktop`. The next refresh drops this entry."

[[gap]]
operations = ["sha256/16KB"]
on = ["nixos2"]
reason = "Closed by [#353](https://github.com/moq-dev/rind/pull/353), after this data: CPUs with AVX2 but without the SHA extensions run OpenSSL's AVX2 routine, the one OpenSSL runs on `nixos2`. The next refresh drops this entry."

[[gap]]
operations = ["sha512/1350B"]
on = ["nixos"]
reason = "Closed by [#353](https://github.com/moq-dev/rind/pull/353), after this data: Zen 3 runs OpenSSL's AVX2 routine rather than aws-lc's scalar one, which interleaved runs measured at 0.84× OpenSSL's time at this size. The next refresh drops this entry."

[[gap]]
operations = ["ed25519-verify", "mlkem768-encaps"]
on = ["nixos2"]
reason = "From an older run than the other hosts', before [#339](https://github.com/moq-dev/rind/pull/339) reworked Ed25519 for its proof. Neither shows on the other hosts, and the next refresh rechecks both."

[[gap]]
operations = ["p256-ecdsa-verify/*"]
on = ["no ADX"]
reason = "Only CPUs older than Broadwell and Zen lack ADX, and there rind runs s2n-bignum's verified `_alt` routines."

[[gap]]
operations = ["chacha20poly1305/*/16KB", "xchacha20poly1305/*/16KB"]
on = ["no AES-NI"]
reason = "Without SSE4.1 rind runs Graviola's scalar Poly1305 rather than port BoringSSL's SSE2 `poly1305_vec.c` for CPUs older than Westmere, as README records."
