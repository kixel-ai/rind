# The code each library runs that a published formal proof covers, which
# BENCHMARKS.md marks with a ✓. `admin/bench-report render` reads it and
# refuses an entry that names no library, operation, or CPU feature it knows.
#
# An entry earns its ✓ when a machine-checked proof shows that all the code
# computing the operation gives the specified result for every input, in the
# version that library ships, on that architecture and CPU: the cipher and its
# mode, the hash over every block with its padding, the whole scalar
# multiplication or modular exponentiation. Parsing, encoding, randomness, and the hash inside a
# signature (its own row) are left out. A proof of memory safety, panic
# freedom, or secret independence alone earns none, nor one covering only some
# of the arithmetic, such as field operations under unverified point formulas.
# s2n-bignum's proofs check its own object code and HACL*'s its C, so code
# copied from s2n-bignum or compiled from HACL* counts, as README's Sources
# table says.
#
# Each entry:
#   library     rind, aws-lc-rs, ring, rustcrypto, graviola, libcrux, or openssl
#   operations  report rows, as admin/bench-report's OPERATIONS without the
#               library; `*` matches any message size
#   arch        optional: x86_64 or aarch64, unless the code is the same on both
#   cpu         optional: features the host has, or lacks with a leading `!`,
#               as rind-cpuid names them; needs an arch
#   os          optional: linux or macos, where the code differs by OS
#   proof       whose proof, of which routines, and any restriction
#   link        the proof itself
#
# ring, RustCrypto + dalek, and OpenSSL have none: at most their field
# arithmetic is verified, under unverified point formulas or ladders.

# rind: X25519 and Ed25519 run only s2n-bignum routines; point encoding is
# rind's Rust. rind pads SHA-512 in its own Rust, so its verified aws-lc block
# function earns no ✓, and every other operation runs some unverified
# arithmetic, such as P-256's base-point table or the RSA exponentiation.
[[verified]]
library = "rind"
operations = ["x25519-ecdh"]
arch = "x86_64"
cpu = ["bmi2", "adx"]
proof = "s2n-bignum's HOL Light proofs of curve25519_x25519 and curve25519_x25519base, of s2n-bignum's own object code, which rind transliterates"
link = "https://github.com/awslabs/s2n-bignum/blob/9f2cd960e11892a582e7facb0c191b4a2959ea91/x86/proofs/curve25519_x25519.ml"

[[verified]]
library = "rind"
operations = ["x25519-ecdh"]
arch = "aarch64"
proof = "s2n-bignum's HOL Light proofs of curve25519_x25519_alt and curve25519_x25519base_alt, of s2n-bignum's own object code, which rind transliterates"
link = "https://github.com/awslabs/s2n-bignum/blob/9f2cd960e11892a582e7facb0c191b4a2959ea91/arm/proofs/curve25519_x25519_alt.ml"

[[verified]]
library = "rind"
operations = ["ed25519-sign"]
arch = "x86_64"
cpu = ["bmi2", "adx"]
proof = "s2n-bignum's HOL Light proofs of edwards25519_scalarmulbase, bignum_mod_n25519, and bignum_madd_n25519, of s2n-bignum's own object code, which rind transliterates"
link = "https://github.com/awslabs/s2n-bignum/blob/9f2cd960e11892a582e7facb0c191b4a2959ea91/x86/proofs/edwards25519_scalarmulbase.ml"

[[verified]]
