# libcrux: portable Rust that KaRaMeL generates from HACL*, with no CPU
# dispatch. libcrux records no HACL* revision, so these link to HACL*'s main
# branch as of 2026-11-03. Its ML-KEM proofs are partial, its XChaCha20
# construction is unverified Rust, and its AES is pre-verification.
[[verified]]
library = "libcrux"
operations = ["sha256/*", "sha512/*"]
proof = "HACL*'s F* proof of Hacl.Streaming.SHA2's hash_256 and hash_512, compiled to Rust by an unverified step"
link = "https://github.com/hacl-star/hacl-star/blob/f557259007db9933442dde10aa995c1b00bd3446/code/streaming/Hacl.Streaming.SHA2.fst"

[[verified]]
library = "libcrux"
operations = ["hmac-sha256/*"]
proof = "HACL*'s F* proof of Hacl.HMAC's compute_sha2_256, compiled to Rust by an unverified step"
link = "https://github.com/hacl-star/hacl-star/blob/f557259007db9933442dde10aa995c1b00bd3446/code/hmac/Hacl.HMAC.fst"

[[verified]]
