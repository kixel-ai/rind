name = "rind"
defaultTargets = ["Rind"]

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
# nightly-2026.11.03, whose release carries a prebuilt archive of this library.
rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
subDir = "backends/lean"

# No module imports both targets: their translations share global names.
[[lean_lib]]
name = "Rind"
globs = ["Rind.+"]
# Lean's default 512 is too shallow for `Array.make`'s length proof of the
# 256-word rows of P-256's generator table in the translation.
leanOptions = { maxRecDepth = 1024 }
