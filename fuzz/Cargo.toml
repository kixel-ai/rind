[package]
name = "rind-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
aws-lc-rs = { version = "1.16", features = ["non-fips", "ring-io"], default-features = false }
# aws-lc's XChaCha20-Poly1305, which aws-lc-rs does not expose.
aws-lc-sys = { version = "0.47", default-features = false }
# Tells which Ed25519 keys are of small order, which rind refuses.
curve25519-dalek = { version = "5", default-features = false }

[dependencies.rind]
path = "../rind"

[[bin]]
name = "sha1"
path = "fuzzer/sha1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sha2"
path = "fuzzer/sha2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aead"
path = "fuzzer/aead.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kx"
path = "fuzzer/kx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keys"
path = "fuzzer/keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzzer/verify.rs"
test = false
